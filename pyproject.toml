[project]
name = "genai-knowledge-explorer"
version = "1.0.0"
description = "Navigate the generative AI landscape through RAG chat and interactive topic visualization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "openai>=1.30.0",
    "chromadb>=0.5.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.uv]
python = "3.12"
